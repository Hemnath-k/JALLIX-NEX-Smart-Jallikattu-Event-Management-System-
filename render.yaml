services:
  - type: web
    name: jallix-backend
    runtime: python
    runtimeVersion: 3.11
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromCommand: openssl rand -base64 32
      - key: JWT_SECRET_KEY
        fromCommand: openssl rand -base64 32
    
  - type: web
    name: jallix-frontend
    runtime: static
    buildCommand: echo "Frontend build complete"
    staticPublishPath: ./
